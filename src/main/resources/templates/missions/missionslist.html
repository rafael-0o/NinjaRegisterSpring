<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Full list of missions</title>
</head>
<body>
<div>
<table>
    <thead>
        <tr>
            <th>name</th>
            <th>difficulty</th>
            <th>Create new mission <a href="@{/api/missions/ui/crete}"></a></th>
        </tr>
    </thead>
    <tbody>
        <tr th:each="mission: ${missions}">
            <td th:text="mission.name"></td>
            <td th:text="mission.difficulty"></td>
            <td>
                <a th:href="@{/api/missions/ui/showbyid/{id}(id=${mission.id})}">Details</a>
                <a th:href="@{/api/missions/ui/editbyid/{id}(id=${mission.id})}">Update</a>
                <a th:href="@{/api/missions/ui/deletebyid/{id}(id=${mission.id})}">Delete</a>
            </td>
        </tr>
    </tbody>
</table>
</div>
</body>
</html>
